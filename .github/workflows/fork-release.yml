name: Build and publish customized Fossify Clock

on:
  push:
    branches: [main]
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:

concurrency:
  group: fossify-clock-fork-release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the triggering source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0

      - name: Integrate the latest stable upstream release
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/FossifyOrg/Clock.git
          git fetch upstream '+refs/tags/*:refs/tags/upstream/*'
          baseline="$(tr -d '\r\n' < .github/upstream-release-tag)"
          latest_tag="$(git for-each-ref --format='%(refname:strip=3)' refs/tags/upstream \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1)"
          [[ -n "$latest_tag" ]] || { echo 'No stable upstream release tags were found.' >&2; exit 1; }
          if [[ "$(printf '%s\n%s\n' "$baseline" "$latest_tag" | sort -V | tail -n 1)" == "$baseline" ]]; then
            echo "Upstream is current at ${baseline}."
            exit 0
          fi

          upstream_sha="$(git rev-parse "refs/tags/upstream/${latest_tag}^{commit}")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Do not auto-resolve conflicts. A failed merge exits before any fork push.
          git merge --no-edit "$upstream_sha"
          printf '%s\n' "$latest_tag" > .github/upstream-release-tag
          git add .github/upstream-release-tag
          git commit -m "chore: integrate upstream release ${latest_tag}"
          git push origin HEAD:refs/heads/main

      - name: Resolve the release source
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'push' ]]; then
            branch_sha="$(git ls-remote origin refs/heads/main | awk 'NR == 1 {print $1}')"
            if [[ -n "$branch_sha" && "$branch_sha" != "$(git rev-parse HEAD)" ]] && git merge-base --is-ancestor HEAD "$branch_sha"; then
              echo 'build=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          baseline="$(tr -d '\r\n' < .github/upstream-release-tag)"
          upstream_tag="$baseline"
          upstream_body="$(gh api "repos/FossifyOrg/Clock/releases/tags/${baseline}" --jq '.body // "No upstream release notes were published."')"

          source_sha="$(git rev-parse HEAD)"
          existing="$(SOURCE_SHA="$source_sha" gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[] | select((.body // "") | contains("Fork source commit: `" + env.SOURCE_SHA + "`")) | select(any(.assets[]?; .name == "clock-fork.apk")) | .tag_name' | head -n 1)"
          if [[ -n "$existing" ]]; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_version="$(sed -n 's/^VERSION_NAME=//p' gradle.properties | head -n 1)"
          [[ -n "$base_version" ]] || { echo 'Could not resolve VERSION_NAME from gradle.properties.' >&2; exit 1; }
          version_name="${base_version}-fork.${GITHUB_RUN_NUMBER}"
          version_code="$((2027000 + GITHUB_RUN_NUMBER))"
          printf 'build=true\nsource_sha=%s\nupstream_tag=%s\nversion_name=%s\nversion_code=%s\n' \
            "$source_sha" "$upstream_tag" "$version_name" "$version_code" >> "$GITHUB_OUTPUT"
          printf 'upstream_body_b64=%s\n' "$(printf '%s' "$upstream_body" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        if: steps.resolve.outputs.build == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.resolve.outputs.build == 'true'
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Decode signing key
        if: steps.resolve.outputs.build == 'true'
        env:
          CLOCK_KEYSTORE_BASE64: ${{ secrets.CLOCK_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${CLOCK_KEYSTORE_BASE64:?Missing CLOCK_KEYSTORE_BASE64 secret}"
          printf '%s' "$CLOCK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/clock-release.keystore"
          chmod 600 "$RUNNER_TEMP/clock-release.keystore"

      - name: Build signed APK
        if: steps.resolve.outputs.build == 'true'
        env:
          SIGNING_KEY_ALIAS: clock-release
          SIGNING_KEY_PASSWORD: ${{ secrets.CLOCK_KEY_PASSWORD }}
          SIGNING_STORE_FILE: ${{ runner.temp }}/clock-release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.CLOCK_KEYSTORE_PASSWORD }}
          VERSION_NAME: ${{ steps.resolve.outputs.version_name }}
          VERSION_CODE: ${{ steps.resolve.outputs.version_code }}
        run: |
          set -euo pipefail
          : "${SIGNING_KEY_ALIAS:?Missing CLOCK_KEY_ALIAS secret}"
          : "${SIGNING_KEY_PASSWORD:?Missing CLOCK_KEY_PASSWORD secret}"
          : "${SIGNING_STORE_PASSWORD:?Missing CLOCK_KEYSTORE_PASSWORD secret}"
          ./gradlew --no-daemon -PVERSION_NAME="$VERSION_NAME" -PVERSION_CODE="$VERSION_CODE" assembleFossRelease
          apk_path="$(find app/build/outputs/apk/foss/release -type f -name '*.apk' -print -quit)"
          [[ -n "$apk_path" ]] || { echo 'Gradle did not produce a release APK.' >&2; exit 1; }
          cp "$apk_path" "$RUNNER_TEMP/clock-fork.apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          signer="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          analyzer="$(find "$sdk_root" -type f -name apkanalyzer -print -quit)"
          "$signer" verify --verbose "$RUNNER_TEMP/clock-fork.apk"
          test "$("$analyzer" manifest application-id "$RUNNER_TEMP/clock-fork.apk")" = 'org.fossify.clock.fork'

      - name: Upload APK artifact
        if: steps.resolve.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: clock-fork-apk
          path: ${{ runner.temp }}/clock-fork.apk
          if-no-files-found: error
          retention-days: 1

      - name: Publish GitHub Release
        if: steps.resolve.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ runner.temp }}/clock-fork.apk
          RELEASE_TAG: v${{ steps.resolve.outputs.version_name }}
          VERSION_NAME: ${{ steps.resolve.outputs.version_name }}
          VERSION_CODE: ${{ steps.resolve.outputs.version_code }}
          SOURCE_SHA: ${{ steps.resolve.outputs.source_sha }}
          UPSTREAM_TAG: ${{ steps.resolve.outputs.upstream_tag }}
          UPSTREAM_BODY_B64: ${{ steps.resolve.outputs.upstream_body_b64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$UPSTREAM_BODY_B64" | base64 --decode > "$RUNNER_TEMP/upstream-notes.md"
          {
            printf 'Customized Fossify Clock fork build.\n\n'
            printf 'Fork source commit: `%s`\n' "$SOURCE_SHA"
            printf 'Tracked upstream release: `%s`\n' "$UPSTREAM_TAG"
            printf 'Android version: `%s` (versionCode %s)\n\n' "$VERSION_NAME" "$VERSION_CODE"
            printf '## Upstream release notes\n\n'
            cat "$RUNNER_TEMP/upstream-notes.md"
            printf '\n\nPackage ID: `org.fossify.clock.fork`. The APK is signed with this fork’s release key and installs beside the official app.\n'
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" "$APK_PATH" --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" --title "Fossify Clock $VERSION_NAME (default-student fork)" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
